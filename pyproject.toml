[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanmati-codegraph"
version = "0.1.0"
description = "Python-first codebase intelligence and visualization framework."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sanmati" }]
dependencies = []

[project.scripts]
sanmati = "sanmati.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
